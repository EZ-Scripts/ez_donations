<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English+SC:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <div id="card">
            <div class="outer-frame">
                <div class="inner-frame">

                    <div class="seal-wrap">
                        <div class="seal">✦</div>
                    </div>

                    <div class="header">
                        <span class="sub-label">Bright Falls Roleplay</span>
                        <div class="divider"><span>✦</span></div>
                        <h1 class="main-title">Redeem Donation</h1>
                        <div class="divider"><span>✦</span></div>
                    </div>

                    <p class="desc">
                        Present your Tebex transaction code<br>
                        to claim your rightful reward.
                    </p>

                    <div class="input-section">
                        <label class="input-label" for="codeInput">Transaction Code</label>
                        <input
                            type="text"
                            id="codeInput"
                            placeholder="tbx-xxxxxxxxxx-xxxxx"
                            maxlength="60"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>

                    <div class="buttons">
                        <button id="cancelBtn" class="btn btn-cancel">Decline</button>
                        <button id="redeemBtn" class="btn btn-redeem">Redeem</button>
                    </div>

                    <div class="footer">✦ &nbsp; https://www.dawmecorp.com/ &nbsp; ✦</div>

                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
